name: auto linter

on:
  push:
    paths: "*.py"

jobs:
  code-linting:
    runs-on: ubuntu-latest
    steps:
      - name: checkout/clone the code
        uses: actions/checkout@v7

      - name: set up pyhton 
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install linter
        run: pip install ruff

      - name: check the files for linting
        run: ruff check --fix .

  
        
